@if(!isRequestOver()){
<span>Loading...</span>
}@else if (errorInfo()!=='') {
<span>{{errorInfo()}}</span>
}@else if(!product()){
<span>No record found</span>
}@else {
<div>
    <span>Details of: {{product()?.productName}}</span>
    <br>
    <button type="button" class="btn btn-primary" (click)="goToEdit(product()?.productId)">Edit</button>
    <!-- <button type="button" class="btn btn-primary" (click)="goToEdit()">Edit</button> -->
</div>
}
